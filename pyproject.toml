[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timelogger-3000"
version = "0.1.0"
description = "Local-first ActivityWatch time summary tool"
requires-python = ">=3.9"
dependencies = [
  "aw-client==0.5.15",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
desktop = [
  "pywebview>=5.4,<6",
  "pyinstaller>=6.12,<7",
  "dmgbuild>=1.6,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
